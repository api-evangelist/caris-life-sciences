name: Caris Life Sciences
kind: company
description: Caris Life Sciences is a molecular science and precision oncology company
  that delivers comprehensive tumor profiling (Caris Molecular Intelligence / MI Profiling)
  and a clinico-genomic real-world data platform (CODEai). Clinician access is through
  the Caris+Portal and partner-provisioned EHR integrations (Epic Orders and Results
  Anywhere, OncoEMR/Flatiron, iKnowMed, and other CMS-certified systems). Caris does
  not publish a public, self-serve developer API; integration is partner- and
  contract-based.
