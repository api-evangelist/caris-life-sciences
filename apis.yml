apis:
- aid: caris-life-sciences:caris-portal
  name: Caris+Portal
  tags:
  - Portal
  - Ordering
  - Results
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://portal.caris.ai/
  baseURL: https://portal.caris.ai
  properties:
  - url: https://www.carislifesciences.com/order/
    type: Documentation
  - url: openapi/caris-life-sciences-openapi.yml
    type: OpenAPI
  description: Web-based clinician portal for electronically submitting test orders
    (requisitions), tracking case progress, and viewing molecular profiling results.
    Accessed through the browser at portal.caris.ai; no documented public HTTP API
    is exposed to third-party developers.
- aid: caris-life-sciences:ehr-integration
  name: Caris EHR Integration
  tags:
  - EHR
  - HL7
  - Orders and Results
  - Epic
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.carislifesciences.com/partners/ehr-integrations/
  baseURL: https://www.carislifesciences.com/partners/ehr-integrations/
  properties:
  - url: https://www.carislifesciences.com/partners/ehr-integrations/
    type: Documentation
  - url: openapi/caris-life-sciences-openapi.yml
    type: OpenAPI
  description: Partner-provisioned electronic orders-and-results integration with
    CMS-certified EHR systems (Epic Orders and Results Anywhere, OncoEMR/Flatiron,
    iKnowMed, Meditech, Oracle, Aria, Elekta, Practice Fusion, CareEvolve, and
    others). Implemented via standards-based lab order/result interfaces; not a
    publicly documented developer API.
- aid: caris-life-sciences:codeai
  name: Caris CODEai Real-World Data
  tags:
  - Real-World Data
  - Clinico-Genomic
  - Biopharma
  - Research
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.carislifesciences.com/research/artificial-intelligence/caris-codeai/
  baseURL: https://www.carislifesciences.com/research/artificial-intelligence/caris-codeai/
  properties:
  - url: https://www.carislifesciences.com/research/artificial-intelligence/caris-codeai/
    type: Documentation
  - url: openapi/caris-life-sciences-openapi.yml
    type: OpenAPI
  description: Clinico-genomic real-world data platform combining molecular data,
    treatment information, and clinical outcomes for biopharma and academic research
    cohort analysis. Access is granted under contract via a Caris Molecular Science
    Liaison; no public programmatic API is documented.
