description: >-
  FinOps view of Caris Life Sciences engagement. Caris does not operate a
  usage-metered public API and publishes no per-call or per-token cost model.
  Cost is driven by clinical-laboratory reimbursement for molecular profiling
  tests (billed to payers/patients), and by negotiated enterprise contracts for
  the CODEai clinico-genomic data platform. The Caris+Portal and EHR integrations
  are provisioned to ordering providers as part of the testing relationship and
  are not separately metered. There are no public meters to instrument for
  granular API cost attribution.
notes: >-
  Non-reconciled. No public API billing or FOCUS-aligned cost export exists.
  Cost governance applies to clinical testing reimbursement and contracted data
  licensing; confirm commercial terms directly with Caris.
