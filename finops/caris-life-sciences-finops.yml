meters:
- name: molecular_profiling_tests
  description: >-
    Comprehensive tumor profiling tests ordered; billed through clinical-laboratory
    reimbursement channels rather than as metered API usage.
  unit: tests
  aggregation: sum
  dimensions:
  - ordering_provider
  - test_type
- name: codeai_data_license
  description: >-
    Contracted access to the CODEai clinico-genomic real-world data platform for
    biopharma/academic research; priced under negotiated agreement.
  unit: contract
  aggregation: sum
  dimensions:
  - account
  - engagement
principles:
- name: Visibility
  description: No public API usage exports exist; track test volume and contracted data-license spend through Caris account management.
- name: Allocation
  description: Allocate molecular profiling and CODEai costs to the clinical or research programs that order or license them.
- name: Optimization
  description: Optimization is contractual (volume terms, engagement scope) rather than per-call; negotiate with Caris sales.
- name: Accountability
  description: Assign owners to clinical-testing and research-licensing relationships; review contracted spend against budget.
